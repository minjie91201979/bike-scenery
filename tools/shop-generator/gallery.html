<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>各国特色店铺素材画廊</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: radial-gradient(1200px 600px at 50% -10%, #16224a 0%, #0b0f1f 60%);
         color: #e6ecff; margin: 0; padding: 28px; }
  h1 { font-size: 22px; letter-spacing: .5px; }
  .sub { color: #8aa0d6; margin: 4px 0 22px; font-size: 14px; }
  #g { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  figure { margin: 0; background: #141c34; border: 1px solid #28345c; border-radius: 14px;
           overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.35); transition: transform .15s; }
  figure:hover { transform: translateY(-4px); border-color: #4f7bff; }
  img { width: 100%; display: block; aspect-ratio: 1 / 1; object-fit: cover; background:#0e1426; }
  figcaption { padding: 9px 11px; font-size: 13px; color: #c7d4ff; }
</style>
</head>
<body>
  <h1>🏪 各国特色店铺素材画廊</h1>
  <div class="sub">共 12 张 · 由 Agnes Image 2.0 Flash 生成 · 风格统一卡通系列</div>
  <div id="g">
    <figure><img src="./output/cn_chinese_tea_house.png" alt="cn_chinese_tea_house.png" loading="lazy"/><figcaption>cn_chinese_tea_house.png</figcaption></figure>
    <figure><img src="./output/fr_french_cafe.png" alt="fr_french_cafe.png" loading="lazy"/><figcaption>fr_french_cafe.png</figcaption></figure>
    <figure><img src="./output/gb_english_pub.png" alt="gb_english_pub.png" loading="lazy"/><figcaption>gb_english_pub.png</figcaption></figure>
    <figure><img src="./output/gr_greek_taverna.png" alt="gr_greek_taverna.png" loading="lazy"/><figcaption>gr_greek_taverna.png</figcaption></figure>
    <figure><img src="./output/in_indian_spice_shop.png" alt="in_indian_spice_shop.png" loading="lazy"/><figcaption>in_indian_spice_shop.png</figcaption></figure>
    <figure><img src="./output/it_italian_gelateria.png" alt="it_italian_gelateria.png" loading="lazy"/><figcaption>it_italian_gelateria.png</figcaption></figure>
    <figure><img src="./output/jp_japanese_ramen_shop.png" alt="jp_japanese_ramen_shop.png" loading="lazy"/><figcaption>jp_japanese_ramen_shop.png</figcaption></figure>
    <figure><img src="./output/ma_moroccan_shop.png" alt="ma_moroccan_shop.png" loading="lazy"/><figcaption>ma_moroccan_shop.png</figcaption></figure>
    <figure><img src="./output/mx_mexican_market.png" alt="mx_mexican_market.png" loading="lazy"/><figcaption>mx_mexican_market.png</figcaption></figure>
    <figure><img src="./output/nl_dutch_cheese_shop.png" alt="nl_dutch_cheese_shop.png" loading="lazy"/><figcaption>nl_dutch_cheese_shop.png</figcaption></figure>
    <figure><img src="./output/th_thai_street_food.png" alt="th_thai_street_food.png" loading="lazy"/><figcaption>th_thai_street_food.png</figcaption></figure>
    <figure><img src="./output/us_american_diner.png" alt="us_american_diner.png" loading="lazy"/><figcaption>us_american_diner.png</figcaption></figure>
  </div>
</body>
</html>
